name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail fast on a dependency that cannot be fetched rather than retrying for
  # minutes.
  CARGO_NET_RETRY: 2

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # NFR-1 and the platform-parity rule in CLAUDE.md 5: Linux and Windows are
  # both first-class. A Linux pass does not imply a Windows pass, so both run
  # on every push and neither is allowed to fail quietly.
  check:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # M3 adds serialport, which needs libudev on Linux, and M2 adds eframe,
      # which needs the X11/Wayland development headers. Neither is a
      # dependency yet; add the apt step here when they land.

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  # The core crate's contracts are documented with intra-doc links, and a
  # broken one is invisible to clippy. This is the only check that sees it.
  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # rust-version in Cargo.toml is a claim; this is what makes it true. The
  # resolver is MSRV-aware, so a failure here means a dependency has no
  # version that supports 1.85 and the declared MSRV must be raised honestly.
  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # NFR-11: no component with a licence incompatible with a free-software
  # release. Licence drift in a transitive dependency is silent without this.
  # Advisories are deliberately not checked here: a new advisory would turn
  # every unrelated push red. Run `cargo deny check advisories` by hand.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
