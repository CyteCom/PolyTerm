[workspace]
resolver = "3"
members = [
    "crates/polyterm-core",
    "crates/polyterm-term",
    "crates/polyterm-ssh",
    "crates/polyterm-serial",
    "crates/polyterm-pty",
    "crates/polyterm-rdp",
    "crates/polyterm-store",
    "crates/polyterm-ui",
    "apps/polyterm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository   = "https://github.com/CyteCom/PolyTerm"

# Single source of truth for versions. Member crates use
# `foo = { workspace = true }` and never pin their own.
#
# Verify every version against crates.io before the first build — these are
# starting points, not researched pins, and several of these crates move fast.
[workspace.dependencies]

# --- async runtime -----------------------------------------------------------
tokio        = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util   = "0.7"
futures      = "0.3"
bytes        = "1"

# --- ui ----------------------------------------------------------------------
# eframe pinned to the wgpu backend; the glow backend is not supported here.
eframe       = { version = "0.29", default-features = false, features = ["wgpu", "persistence"] }
egui         = "0.29"

# --- terminal ----------------------------------------------------------------
alacritty_terminal = "0.24"

# --- transports --------------------------------------------------------------
russh        = "0.45"
russh-keys   = "0.45"
russh-sftp   = "2"
serialport   = "4"
portable-pty = "0.8"

# --- rdp ---------------------------------------------------------------------
# Provisional per ADR-2. Gated behind a feature so the libfreerdp fallback can
# coexist if the M0 spike returns an ambiguous result.
ironrdp-client = "0.1"

# --- storage & config --------------------------------------------------------
rusqlite     = { version = "0.32", features = ["bundled"] }
keyring      = "3"
directories  = "5"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# --- errors & logging --------------------------------------------------------
thiserror    = "2"          # library crates
anyhow       = "1"          # binary only
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- misc --------------------------------------------------------------------
uuid         = { version = "1", features = ["v4", "serde"] }
parking_lot  = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Terminal rendering and RDP frame handling are unusably slow in an unoptimised
# debug build. Optimise dependencies while keeping our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2
