[workspace]
resolver = "3"
members = [
    "crates/polyterm-core",
    "crates/polyterm-term",
    "crates/polyterm-ssh",
    "crates/polyterm-serial",
    "crates/polyterm-pty",
    "crates/polyterm-rdp",
    "crates/polyterm-store",
    "crates/polyterm-ui",
    "apps/polyterm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CyteCom/PolyTerm"

# Single source of truth for versions. Member crates use
# `foo = { workspace = true }` and never pin their own.
#
# Versions verified against crates.io on 2026-09-09. Entries marked (unused)
# are declared for the milestone that needs them and are not yet referenced by
# any member crate.
[workspace.dependencies]

# --- async runtime -----------------------------------------------------------
tokio        = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util   = "0.7"          # (unused until M2)
futures      = "0.3"          # (unused until M2)
bytes        = "1.12"

# --- ui ----------------------------------------------------------------------
# eframe pinned to the wgpu backend; the glow backend is not supported here.
eframe       = { version = "0.36", default-features = false, features = [
    "wgpu",          # GPU backend; the glow/GL backend is deliberately left off
    "persistence",
    "default_fonts", # egui's built-in fonts, including the monospace face
    "x11",           # Linux windowing backends (winit will not compile without one)
    "wayland",
    "accesskit",     # groundwork for NFR-13 keyboard/AT navigation
] }
egui         = "0.36"         # (unused until M2)

# --- terminal ----------------------------------------------------------------
alacritty_terminal = "0.26"   # (unused until M2)

# --- transports --------------------------------------------------------------
# russh-keys is deliberately absent: it was folded into russh, last saw a
# release in January 2025, and russh 0.63 depends on ssh-key/ssh-encoding
# instead. Do not reintroduce it.
russh        = "0.63"         # (unused until M5)
russh-sftp   = "3"            # (unused until M7; pairing with russh 0.63 is unverified)
serialport   = { version = "4.10", default-features = false }  # no libudev: keep pure-Rust (see DECISIONS)
portable-pty = "0.9"          # (unused until M2)

# --- rdp ---------------------------------------------------------------------
# Provisional per ADR-2 and gated on the M0 spike. polyterm-rdp must NOT
# reference this until M0 returns a verdict.
ironrdp-client = "0.1"        # (unused until M8)

# --- storage & config --------------------------------------------------------
rusqlite     = { version = "0.40", features = ["bundled"] }  # (unused until M4)
keyring      = "4"
keyring-core = "1"            # (unused until M4)
directories  = "6"            # (unused until M4)
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"            # (unused until M4)

# --- errors & logging --------------------------------------------------------
thiserror    = "2"            # library crates
anyhow       = "1"            # binary only
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- misc --------------------------------------------------------------------
uuid         = { version = "1", features = ["v4", "serde"] }
parking_lot  = "0.12"         # (unused until M2)
# Human-readable, multithread-safe local timestamps for session logging
# (FR-50). Pure Rust; its non-dev deps carry no C dependency.
jiff         = "0.2"
# Scrubs Secret<T> from memory on drop. Pure Rust, no mandatory dependencies
# of its own; see the consequence recorded under ADR-8.
zeroize      = "1.9"

# Enforced workspace-wide via `[lints] workspace = true` in every member.
# `unwrap`/`expect` are a hard rule from CLAUDE.md 5, not a preference; test
# modules opt out locally with an #[allow].
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Terminal rendering and RDP frame handling are unusably slow in an unoptimised
# debug build. Optimise dependencies while keeping our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2
